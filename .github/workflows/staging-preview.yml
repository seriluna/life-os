name: Staging preview and browser tests

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test

  package-preview:
    needs: browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Package static preview
        run: |
          mkdir -p preview
          cp index.html app.js health-log.js sw.js manifest.json icon-192.png icon-512.png preview/
          cd preview
          zip -r ../life-os-staging-preview.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: life-os-staging-preview
          path: life-os-staging-preview.zip
          if-no-files-found: error
          retention-days: 7
